name: Charlie CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          corepack pnpm@10.15.1 install --frozen-lockfile

      - name: Charlie regression tests
        env:
          CI: "true"
        run: |
          corepack pnpm@10.15.1 test:charlie

      - name: Runtime dependency compatibility
        run: corepack pnpm@10.15.1 test:dependency-compatibility

      - name: Dependency audit with reviewed scope boundaries
        run: corepack pnpm@10.15.1 audit:dependencies

      - name: Build Chrome extension
        run: |
          corepack pnpm@10.15.1 build:chrome

      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
